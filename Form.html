<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEST JOL</title>
    <style>
      html, body{
          height: 100%;
          margin: 0;
      }
      body{
          display: flex;
          justify-content: center;
          align-items: center;
          background-color: #391616;
      }
      form{
          width: 360px;
          height: 200px;
          padding: 10px;
          border: 1px solid red;
          border-radius: 5px;
          background-color: #d5d0d0;
          box-shadow: 3px 3px 3px 3px
      }
      formcontroller{
       10px;
      }
      input{type="text"}

          width: 180%;
          height: 35px;

      input[type="password"]{
          width: 45%;
          height: 35px;
      }
      label
        {
            font-size: large;
            width: 80px;
        }
    </style>
  </head>
  <body>
    <form action="">
      <div class="formcontroller">
        <label for="name">username:</label>
        <input type="text" placeholder="username" name="username" />
      </div>
      <div>
        <label for="password">password:</label>
        <input type="password" placeholder="password" name="password" />
      </div>
      <div class="formcontroller">
        <button style="color: blue" type="submit">LOGIN</button>
      </div>
    </form>
  </body>
</html>
